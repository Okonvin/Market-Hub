<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Hub</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=menu" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="logo">
            <a href="#">M- <span>Hub</span></a>
        </div>
        
        <nav class="nav" id="nav">
            <a href="#home">Home</a>
            <a href="#product">Product</a>
            <a href="#categories">Categories</a>
            <a href="#sell">Sell Product</a>
            <a href="#about">About</a>
        </nav>

        <div class="header-btn" >
            <button class="cart-btn" id="cartBtn">
                cart <span id="cartCount">0</span>
            </button>

            <button class="menu-btn" id="menuBtn">
                <span class="material-symbols-outlined">
                  menu
                </span>
            </button>
        </div>
    </header>


    <main>
        <!---------------- HERO SECTION -------------->
        <section id="hero">
            <div class="hero-text">
                <h2>Welcome to Market-Hub</h2>
                <h3>Buy and Sell Products <span> Near You</span></h3>
                <p>Discover products from local sellers and find exactly what you need at <br>affordable prices.</p>
            </div>

            <div class="hero-btn">
                <a href="" class="product-btn">Products</a>
                <a href="" class="sell-btn">Sell Your Products</a>
            </div>
        </section>

        <!---------------- CATEGORY WITH BUTTONS SECTION -------------->
        <section class="categories">
            <div class="inputs">
                <input 
                    type="text" 
                    placeholder="Search for products" 
                    id="product-search"
                >
                <button id="Search"> Search</button>
            </div>
            <div class="Category-btn-sec">
               <div class="Categories-heading">
                    <h2>Shop by Category</h2>
                    <p>Explore Categories</p>
               </div>
               <div class="Category-btn">
                    <button class="active"
                        data-category="all">
                        All
                    </button>

                    <button
                        data-category="fashion">
                        Fashion
                    </button>

                    <button  
                        data-category="electronics">
                        Electronics
                    </button>

                    <button 
                        data-category="phone">
                        Phone
                    </button>

                    <button  
                        data-category="home">
                        Home
                    </button>

                    <button z
                        data-category="beauty">
                        Beauty
                    </button>
               </div>
            </div>

        </section>

    </main>

    <footer></footer>

    <script src="script.js"></script>
</body>
</html>
